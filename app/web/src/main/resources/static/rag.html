<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库 RAG 检索系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: #fff;
            border-bottom: 1px solid #e5e5e7;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1d1d1f;
        }
        header .badge {
            font-size: 12px;
            background: #0071e3;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 360px;
            background: #fff;
            border-right: 1px solid #e5e5e7;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        .sidebar-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        /* Upload area */
        .upload-zone {
            border: 2px dashed #d2d2d7;
            border-radius: 12px;
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #0071e3;
            background: #f0f7ff;
        }
        .upload-zone .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .upload-zone p {
            font-size: 13px;
            color: #86868b;
            margin-top: 4px;
        }
        .upload-zone input { display: none; }

        #upload-status {
            font-size: 12px;
            color: #0071e3;
            margin-top: 8px;
            text-align: center;
            min-height: 18px;
        }
        #upload-status.error { color: #ff3b30; }

        /* Document list */
        .doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px;
        }
        .doc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: background 0.15s;
        }
        .doc-item:hover { background: #f5f5f7; }
        .doc-info { flex: 1; min-width: 0; }
        .doc-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .doc-meta {
            font-size: 11px;
            color: #86868b;
            margin-top: 2px;
        }
        .doc-delete {
            background: none;
            border: none;
            color: #ff3b30;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .doc-item:hover .doc-delete { opacity: 1; }
        .doc-delete:hover { background: #ffe5e5; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #86868b;
            font-size: 13px;
        }

        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f5f7;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .chat-message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message.user {
            align-self: flex-end;
            background: #0071e3;
            color: #fff;
        }
        .chat-message.assistant {
            align-self: flex-start;
            background: #fff;
            border: 1px solid #e5e5e7;
            color: #1d1d1f;
        }
        .chat-message .sources {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #e5e5e7;
            font-size: 12px;
            color: #86868b;
        }
        .chat-message .source-item {
            margin-top: 4px;
            padding: 4px 8px;
            background: #f5f5f7;
            border-radius: 4px;
            font-size: 11px;
        }

        /* Chat input */
        .chat-input-area {
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #e5e5e7;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-area input:focus {
            border-color: #0071e3;
        }
        .chat-input-area button {
            padding: 10px 22px;
            border: none;
            background: #0071e3;
            color: #fff;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .chat-input-area button:hover { background: #0060c0; }
        .chat-input-area button:disabled {
            background: #a1a1a6;
            cursor: not-allowed;
        }

        .chat-input-area .topk-select {
            padding: 8px 12px;
            border: 1px solid #d2d2d7;
            border-radius: 16px;
            font-size: 13px;
            outline: none;
            background: #fff;
        }

        /* Loading dots */
        .loading-dots {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }
        .loading-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #86868b;
            animation: bounce 1.2s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <header>
        <h1>📚 知识库 RAG 检索系统</h1>
        <span class="badge">ES + LLM</span>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>📤 上传文档</h3>
                <div class="upload-zone" id="upload-zone">
                    <div class="icon">📄</div>
                    <strong>点击或拖拽上传</strong>
                    <p>支持 PDF / Word / TXT，最大 10MB</p>
                    <input type="file" id="file-input" accept=".pdf,.doc,.docx,.txt,.md,.html" multiple>
                </div>
                <div id="upload-status"></div>
            </div>

            <div class="sidebar-section">
                <h3>📋 已上传文档</h3>
            </div>
            <div class="doc-list" id="doc-list">
                <div class="empty-state">暂无文档，请上传</div>
            </div>
        </aside>

        <!-- Chat area -->
        <main class="chat-area">
            <div class="chat-messages" id="chat-messages">
                <div class="chat-message assistant">
                    👋 你好！我是知识库问答助手。<br>
                    请先在左侧上传文档，然后在这里提出你的问题。
                </div>
            </div>

            <div class="chat-input-area">
                <select class="topk-select" id="topk-select" title="检索片段数">
                    <option value="2">Top 2</option>
                    <option value="4" selected>Top 4</option>
                    <option value="6">Top 6</option>
                    <option value="8">Top 8</option>
                </select>
                <input type="text" id="question-input"
                    placeholder="输入你的问题，基于已上传的知识库..."
                    autocomplete="off">
                <button id="send-btn" onclick="askQuestion()">发送</button>
            </div>
        </main>
    </div>

    <script>
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const uploadStatus = document.getElementById('upload-status');
        const docList = document.getElementById('doc-list');
        const chatMessages = document.getElementById('chat-messages');
        const questionInput = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        const topkSelect = document.getElementById('topk-select');

        // ==================== 文档上传 ====================

        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFiles);

        uploadZone.addEventListener('dragover', e => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        uploadZone.addEventListener('drop', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFilesDirect(e.dataTransfer.files);
        });

        function handleFiles() {
            handleFilesDirect(fileInput.files);
            fileInput.value = '';
        }

        async function handleFilesDirect(files) {
            for (const file of files) {
                setStatus(`正在上传: ${file.name}...`, '');
                const formData = new FormData();
                formData.append('file', file);

                try {
                    const resp = await fetch('/api/v1/documents/upload', {
                        method: 'POST',
                        body: formData,
                    });
                    const result = await resp.json();

                    if (result.success) {
                        setStatus(`✅ ${file.name} 上传成功 (${result.data.chunkCount} 个分块)`, '');
                        loadDocuments();
                    } else {
                        setStatus(`❌ ${result.msg}`, 'error');
                    }
                } catch (err) {
                    setStatus(`❌ 上传失败: ${err.message}`, 'error');
                }
            }
        }

        function setStatus(msg, cls) {
            uploadStatus.textContent = msg;
            uploadStatus.className = cls;
        }

        // ==================== 文档列表 ====================

        async function loadDocuments() {
            try {
                const resp = await fetch('/api/v1/documents');
                const result = await resp.json();

                if (!result.success || !result.data || result.data.length === 0) {
                    docList.innerHTML = '<div class="empty-state">暂无文档，请上传</div>';
                    return;
                }

                docList.innerHTML = result.data.map(doc => `
                    <div class="doc-item">
                        <div class="doc-info">
                            <div class="doc-name" title="${esc(doc.name)}">📄 ${esc(doc.name)}</div>
                            <div class="doc-meta">
                                ${formatSize(doc.size)} · ${doc.chunkCount || 0} 分块 · ${formatDate(doc.createdAt)}
                            </div>
                        </div>
                        <button class="doc-delete" onclick="deleteDocument('${esc(doc.id)}')" title="删除">🗑</button>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load documents:', err);
            }
        }

        async function deleteDocument(id) {
            if (!confirm('确定要删除此文档及其所有向量数据吗？')) return;

            try {
                const resp = await fetch(`/api/v1/documents/${id}`, { method: 'DELETE' });
                const result = await resp.json();
                if (result.success) {
                    loadDocuments();
                } else {
                    alert('删除失败: ' + result.msg);
                }
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }

        // ==================== RAG 问答 ====================

        questionInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') askQuestion();
        });

        async function askQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            // 添加用户消息
            addMessage('user', question);
            questionInput.value = '';
            sendBtn.disabled = true;

            // 添加加载提示
            const loadingMsg = addMessage('assistant', '<div class="loading-dots"><span></span><span></span><span></span></div>');

            try {
                const resp = await fetch('/api/v1/rag/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        topK: parseInt(topkSelect.value),
                        similarityThreshold: 0.5
                    }),
                });
                const result = await resp.json();

                // 移除加载提示
                loadingMsg.remove();

                if (result.success) {
                    const data = result.data;
                    let html = esc(data.answer).replace(/\n/g, '<br>');

                    if (data.sources && data.sources.length > 0) {
                        html += '<div class="sources">📎 引用来源：';
                        data.sources.forEach((src, i) => {
                            html += `<div class="source-item">[${i + 1}] <strong>${esc(src.documentName)}</strong> #${src.chunkIndex + 1}: ${esc(src.content)}</div>`;
                        });
                        html += '</div>';
                    }

                    addMessage('assistant', html);
                } else {
                    addMessage('assistant', '❌ 查询失败: ' + esc(result.msg));
                }
            } catch (err) {
                loadingMsg.remove();
                addMessage('assistant', '❌ 网络错误: ' + esc(err.message));
            } finally {
                sendBtn.disabled = false;
                questionInput.focus();
            }
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `chat-message ${role}`;
            div.innerHTML = content;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }

        // ==================== 工具函数 ====================

        function esc(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatSize(bytes) {
            if (!bytes) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            let size = bytes;
            while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
            return size.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // ==================== 初始化 ====================

        loadDocuments();
    </script>
</body>
</html>
