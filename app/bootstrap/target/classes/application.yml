# ============================================================
# RAG 知识库检索系统 — 应用配置
# ============================================================

server:
  port: 8081

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Elasticsearch 配置（通过环境变量注入）
  elasticsearch:
    uris: ${ES_URIS:http://127.0.0.1:19200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}

  # Spring AI 配置 — SiliconFlow (硅基流动) 统一提供 Chat + Embedding
  ai:
    openai:
      api-key: ${SILICONFLOW_API_KEY:sk-yrljktvuunosmatclqcyascloedjhyjzdvukbxithmccuilr}
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn}
      chat:
        options:
          model: ${CHAT_MODEL:deepseek-ai/DeepSeek-V3}
          temperature: 0.7
      embedding:
        options:
          model: ${EMBEDDING_MODEL:BAAI/bge-m3}

    # Elasticsearch 向量存储
    vectorstore:
      elasticsearch:
        uri: http://192.168.5.9:9200
        index-name: rag_knowledge_base
        dimensions: 1024
        initialize-schema: true

# RocketMQ（保持原有配置）
rocketmq:
  name-server: 192.168.1.3:9876
  producer:
    group: producer_group_demo

# 日志
logging:
  level:
    com.example.esDemo: DEBUG
    org.springframework.ai: DEBUG
