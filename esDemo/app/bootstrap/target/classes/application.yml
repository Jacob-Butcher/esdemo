# provider/src/main/resources/application.yml
dubbo:
  application:
    name: dubbo-provider
  protocol:
    name: dubbo
    port: 20880
  registry:
    address: nacos://localhost:8848  # Nacos注册中心地址
  scan:
    base-packages: com.example.esDemo  # 扫描Dubbo服务类


rocketmq:
  name-server: 192.168.1.3:9876  # 宿主机IP:9876
  producer:
    group: producer_group_demo      # 生产者组名（需唯一）